server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;

        # .mjs absent des types par défaut : sans ça le worker PDF.js est servi en octet-stream et le CV ne s'affiche pas
        include /etc/nginx/mime.types;
        types {
            application/javascript mjs;
        }

        index index.html;
        try_files $uri /index.html;
    }
}

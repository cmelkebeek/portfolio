name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Déploiement à chaque push sur main
  pull_request:
    branches:
      - main  # Vérification (lint + build) uniquement

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Connexion au registre privé
        uses: docker/login-action@v4
        with:
          registry: registry.c-mbk.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tag "latest" + tag du commit pour pouvoir revenir à une version précédente
      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            registry.c-mbk.fr/portfolio:latest
            registry.c-mbk.fr/portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
